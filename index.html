<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Sky Runner</title>
<style>
html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#071426;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#status{padding:24px;text-align:center;font-size:18px}
</style>
</head>
<body>
<div id="status">Loading Sky Runner…</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const url='https://raw.githubusercontent.com/mariusmuntean/runner/8017ebb3a77a9278a481c4d4dec88eee1b6b3e7d/index.html';
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const game=await response.text();
    if(!game.includes('Sky Runner')) throw new Error('Invalid game file');
    document.open();
    document.write(game);
    document.close();
  }catch(error){
    status.textContent='Could not load Sky Runner. Please refresh in a moment. ('+error.message+')';
  }
})();
</script>
</body>
</html>
